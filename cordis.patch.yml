# dsh-stt-multi: multi-instance speech providers.
#
# Каждая запись = один движок в списке настроек голосового ввода DSH.
# Копируй блок и меняй id/modelId, чтобы добавить модель; modelDirectory
# подключает произвольную sherpa-совместимую модель без загрузки.
- insert:
    - id: whisper-small
      name: dsh-stt-multi
      config:
        providerId: whisper-small
        modelId: whisper-small
- insert:
    - id: whisper-tiny
      name: dsh-stt-multi
      config:
        providerId: whisper-tiny
        modelId: whisper-tiny
